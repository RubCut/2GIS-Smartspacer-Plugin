name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Report compile errors (temporary debug step)
        if: failure()
        run: |
          grep -E "^e: |error: |Caused by|FAILURE: Build" build.log | head -30 | while IFS= read -r line; do
            echo "::error::${line:0:4000}"
          done
          test -f build.log || echo "::error::no build.log captured"

      - uses: actions/upload-artifact@v4
        with:
          name: gis2smartspacer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
